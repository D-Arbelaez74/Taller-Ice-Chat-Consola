plugins {
    id 'java-library'
    // Plugin oficial de ZeroC: compila los .ice a Java en build/generated-src
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0'
}

def getShortPath(File f) {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        try {
            def p = ['cmd.exe', '/c', "for %I in (\"${f.absolutePath}\") do @echo %~sI"].execute()
            def out = p.text.trim()
            if (p.waitFor() == 0 && !out.isEmpty()) {
                return out
            }
        } catch (Exception ignored) {}
    }
    return f.absolutePath
}

slice {
    java {
        srcDir = getShortPath(file('src/main/slice'))
    }
}

dependencies {
    // "api" expone el runtime de Ice a server y client
    api 'com.zeroc:ice:3.7.11'
}
