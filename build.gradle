def getShortPath(File f) {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        try {
            def p = ['cmd.exe', '/c', "for %I in (\"${f.absolutePath}\") do @echo %~sI"].execute()
            def out = p.text.trim()
            if (p.waitFor() == 0 && !out.isEmpty()) {
                return out
            }
        } catch (Exception ignored) {}
    }
    return f.absolutePath
}

allprojects {
    group = 'chat'
    version = '1.0'

    repositories {
        mavenCentral()
    }

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        layout.buildDirectory = file(getShortPath(projectDir) + '/build')
    }
}

subprojects {
    apply plugin: 'java'

    // Toolchain: Gradle compila y ejecuta con JDK 17 aunque el "java" del PATH sea otro
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Tareas de entrega exigidas por el enunciado: ./gradlew runServer | ./gradlew runClient
tasks.register('runServer') {
    group = 'application'
    description = 'Inicia el servidor Ice del chat.'
    dependsOn ':server:run'
}

tasks.register('runClient') {
    group = 'application'
    description = 'Inicia un cliente de consola. Servidor remoto: -PserverHost=<ip>'
    dependsOn ':client:run'
}
