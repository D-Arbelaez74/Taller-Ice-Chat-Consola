plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'chat.client.ClientMain'
}

run {
    // Se ejecuta desde client/ para que encuentre config.client
    workingDir = projectDir
    // OBLIGATORIO: permite leer del teclado (System.in) en la CLI
    standardInput = System.in
    // IP del servidor sin editar archivos: ./gradlew runClient -PserverHost=192.168.1.20
    if (project.hasProperty('serverHost')) {
        args "--Chat.Server.Host=${project.property('serverHost')}"
    }
}
